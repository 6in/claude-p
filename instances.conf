# instances.conf — 多重インスタンス設定ファイル。
# 書式: <agent>  <port>  [KEY=VALUE ...]
# コメント行（# で始まる行）と空行は無視される。
# KEY=VALUE 列は spawn 時に環境変数として export される（eval なし）。
#
# agent: agents/ ディレクトリのプロファイル名（例: claude, codex, opencode）
# port:  ht-webif が listen するポート番号
# 追加列: エージェント固有の credential env（スペース区切りで複数指定可）
#
# --- デフォルト 3 インスタンス ---
#
# Claude: ~/.claude/ の OAuth は read-only 共有可（セッション状態は ht-mcp が管理）
claude     8080

# Codex: ~/.codex/ は mutable な session/auth 状態を含むため CODEX_HOME で分離必須
# 実際のパスに合わせて変更してください（例: /home/youruser/.codex-claude-p）
codex      8081  CODEX_HOME=/home/user/.codex-instance1

# OpenCode: ~/.config/opencode/ — Phase 5 実機検証結果に応じて共有可否を判断してください
opencode   8082
