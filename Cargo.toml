[package]
name = "ht-webif"
version = "0.1.0"
edition = "2021"
description = "curl 1発で Claude にタスクを送って結果を受け取れる軽量な HTTP WebIF。ht-mcp 経由で対話型 Claude TUI を駆動し、Max サブスクリプション課金を維持する。"
repository = "https://github.com/0hya6in/ht-mcp-sample"
license = "MIT"
authors = ["ht-webif contributors"]
readme = "README.md"
keywords = ["claude", "mcp", "http", "axum"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
dotenvy = "0.15"
async-trait = "0.1"

[dev-dependencies]
# tower::ServiceExt::oneshot を使うため util feature 必須（D-08）。
tower = { version = "0.5", features = ["util"] }
# テスト中の turns ディレクトリ用（D-25、version pin "3"）。
tempfile = "3"

[lib]
name = "ht_webif"
path = "src/lib.rs"

[[bin]]
name = "ht-webif"
path = "src/main.rs"
